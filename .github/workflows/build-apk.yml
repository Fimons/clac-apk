name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Create Android project structure
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/calculator/app
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/res/drawable
    
    - name: Copy web files
      run: |
        cp calculator.html app/src/main/assets/
        cp manifest.json app/src/main/assets/
        cp icon-192.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        cp icon-512.png app/src/main/res/drawable/
    
    - name: Create project files
      run: |
        cat > app/src/main/AndroidManifest.xml << 'EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application android:allowBackup="true" android:label="Calculator" android:icon="@mipmap/ic_launcher">
                <activity android:name=".MainActivity">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        EOF
        
        mkdir -p app/src/main/java/com/calculator/app
        cat > app/src/main/java/com/calculator/app/MainActivity.kt << 'EOF'
        package com.calculator.app
        import android.os.Bundle
        import android.webkit.WebView
        import android.webkit.WebSettings
        import androidx.appcompat.app.AppCompatActivity
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val webView = WebView(this)
                setContentView(webView)
                webView.settings.javaScriptEnabled = true
                webView.settings.domStorageEnabled = true
                webView.loadUrl("file:///android_asset/calculator.html")
            }
        }
        EOF
        
        cat > build.gradle << 'EOF'
        buildscript { repositories { google(); mavenCentral() } dependencies { classpath 'com.android.tools.build:gradle:8.1.0'; classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0' } }
        EOF
        
        cat > app/build.gradle << 'EOF'
        plugins { id 'com.android.application'; id 'org.jetbrains.kotlin.android' }
        android { namespace 'com.calculator.app'; compileSdk 34; defaultConfig { applicationId "com.calculator.app"; minSdk 21; targetSdk 34; versionCode 1 } }
        dependencies { implementation 'androidx.appcompat:appcompat:1.6.1'; implementation 'androidx.core:core-ktx:1.12.0' }
        EOF
        
        echo 'rootProject.name = "CalculatorApp"' > settings.gradle
        echo "include ':app'" >> settings.gradle
        
        cat > gradle.properties << 'EOF'
        org.gradle.jvmargs=-Xmx2048m
        android.useAndroidX=true
        EOF
    
    - name: Build APK
      run: |
        gradle wrapper --gradle-version 8.0
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: calculator.apk
        path: app/build/outputs/apk/debug/app-debug.apk
