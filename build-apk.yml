name: Build Android APK

on:
  push:
    branches: [ master, main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
    - name: Checkout code
      uses: actions/checkout@v4
    
    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
    
    - name: Create Android project structure
      run: |
        mkdir -p app/src/main/assets
        mkdir -p app/src/main/java/com/calculator/app
        mkdir -p app/src/main/res/mipmap-xxxhdpi
        mkdir -p app/src/main/res/drawable
        mkdir -p app/src/main/res/values
    
    - name: Copy web files
      run: |
        cp calculator.html app/src/main/assets/
        cp manifest.json app/src/main/assets/
        cp icon-192.png app/src/main/res/mipmap-xxxhdpi/ic_launcher.png
        cp icon-512.png app/src/main/res/drawable/
    
    - name: Create AndroidManifest.xml
      run: |
        cat > app/src/main/AndroidManifest.xml << 'MANIFEST_EOF'
        <?xml version="1.0" encoding="utf-8"?>
        <manifest xmlns:android="http://schemas.android.com/apk/res/android">
            <application
                android:allowBackup="true"
                android:label="Calculator"
                android:icon="@mipmap/ic_launcher"
                android:supportsRtl="true"
                android:theme="@android:style/Theme.Material.NoActionBar">
                <activity android:name=".MainActivity">
                    <intent-filter>
                        <action android:name="android.intent.action.MAIN" />
                        <category android:name="android.intent.category.LAUNCHER" />
                    </intent-filter>
                </activity>
            </application>
        </manifest>
        MANIFEST_EOF
    
    - name: Create MainActivity
      run: |
        cat > app/src/main/java/com/calculator/app/MainActivity.kt << 'ACTIVITY_EOF'
        package com.calculator.app
        
        import android.os.Bundle
        import android.webkit.WebView
        import android.webkit.WebSettings
        import androidx.appcompat.app.AppCompatActivity
        
        class MainActivity : AppCompatActivity() {
            override fun onCreate(savedInstanceState: Bundle?) {
                super.onCreate(savedInstanceState)
                val webView = WebView(this)
                setContentView(webView)
                
                val settings: WebSettings = webView.settings
                settings.javaScriptEnabled = true
                settings.domStorageEnabled = true
                settings.allowFileAccess = true
                settings.allowContentAccess = true
                
                webView.loadUrl("file:///android_asset/calculator.html")
            }
        }
        ACTIVITY_EOF
    
    - name: Create root build.gradle
      run: |
        cat > build.gradle << 'ROOT_EOF'
        buildscript {
            repositories {
                google()
                mavenCentral()
            }
            dependencies {
                classpath 'com.android.tools.build:gradle:8.1.0'
                classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:1.9.0'
            }
        }
        ROOT_EOF
    
    - name: Create app/build.gradle
      run: |
        cat > app/build.gradle << 'APP_EOF'
        plugins {
            id 'com.android.application'
            id 'org.jetbrains.kotlin.android'
        }

        android {
            namespace 'com.calculator.app'
            compileSdk 34

            defaultConfig {
                applicationId "com.calculator.app"
                minSdk 21
                targetSdk 34
                versionCode 1
                versionName "1.0"
            }

            buildTypes {
                release {
                    minifyEnabled false
                }
            }

            compileOptions {
                sourceCompatibility JavaVersion.VERSION_1_8
                targetCompatibility JavaVersion.VERSION_1_8
            }

            kotlinOptions {
                jvmTarget = '1.8'
            }
        }

        dependencies {
            implementation 'androidx.appcompat:appcompat:1.6.1'
            implementation 'androidx.core:core-ktx:1.12.0'
        }
        APP_EOF
    
    - name: Create settings.gradle
      run: |
        echo 'rootProject.name = "CalculatorApp"' > settings.gradle
        echo "include ':app'" >> settings.gradle
    
    - name: Create gradle.properties
      run: |
        cat > gradle.properties << 'PROP_EOF'
        org.gradle.jvmargs=-Xmx2048m
        android.useAndroidX=true
        kotlin.code.style=official
        PROP_EOF
    
    - name: Setup Gradle
      run: |
        gradle wrapper --gradle-version 8.0
    
    - name: Build debug APK
      run: |
        ./gradlew assembleDebug --no-daemon
    
    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: calculator.apk
        path: app/build/outputs/apk/debug/app-debug.apk
